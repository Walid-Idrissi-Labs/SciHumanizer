name: Bug in a script
description: A crash, a wrong count, a sentence split in the wrong place, a number the fact ledger misreads
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      render: bash
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Smallest input that shows the problem
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version of the skill
      placeholder: "2.0.0"
